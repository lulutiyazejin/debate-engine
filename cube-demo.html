<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Debate Engine 0.1.6 · 意识形态立方演示</title>
<style>
  :root { --bg:#efece6; --tx:#26221d; --ln:#d8d2c6; --mut:#8a8378; }
  body { margin:0; background:var(--bg); color:var(--tx);
         font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; }
  #bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center;
         padding:10px 16px; border-bottom:1px solid var(--ln); }
  #bar label { display:flex; gap:6px; align-items:center; color:var(--mut); }
  #bar .t { font-weight:600; color:var(--tx); }
  select,input[type=range]{ accent-color:#1c7a3d; }
  #cv { display:block; margin:0 auto; cursor:grab; }
  #cv:active { cursor:grabbing; }
  #tip { position:fixed; pointer-events:none; background:#3a3630; color:#f4f1ea;
         padding:4px 10px; border-radius:4px; font-size:12px; display:none;
         max-width:420px; }
  .hint { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<div id="bar">
  <span class="t">意识形态立方 · 0.1.6 演示</span>
  <label>X 轴色 <input id="cx" type="color" value="#ff0000"></label>
  <label>Y 轴色 <input id="cy" type="color" value="#00ff00"></label>
  <label>Z 轴色 <input id="cz" type="color" value="#0000ff"></label>
  <label>立方透明度 <input id="al" type="range" min="0" max="90" value="18">
    <span id="alv">18%</span></label>
  <label><input id="inv" type="checkbox" checked> 拖动反向</label>
  <label><input id="lab" type="checkbox" checked> 常显标签</label>
  <button id="rst">复位视角</button>
  <span class="hint">拖转 / 滚轮缩放 · 悬停小立方或圆点看名字 · 轴：所有制×政治权力×帝国主义</span>
</div>
<canvas id="cv"></canvas>
<div id="tip"></div>
<script>
"use strict";
/* ---------- 模拟数据：立场小立方由文档坐标实时算出 ---------- */
/* ---------- 模拟数据：每个立场 = 1×1×1 正方体，中心=半整数格点 ---------- */
/* 未分类=(0,0,0)，其他相邻立方体中心偏移±1（如 1.5、2.5、-1.5 等），文档在其±0.5 内 */
const DOCS = [
  // 马列毛主义中心=(-3.5,-1.5,-4.5)
  { s: "马列毛主义立场", t: "列宁《资产阶级知识分子与工人斗争》", c: [-3.7, -1.4, -4.6] },
  { s: "马列毛主义立场", t: "真真假假障眼法之苏修反腐", c: [-3.2, -2.0, -4.1] },
  { s: "马列毛主义立场", t: "俄乌战争后俄国阶级矛盾的分析", c: [-4.0, -1.2, -4.3] },
  { s: "马列毛主义立场", t: "战争深化，俄国左翼思潮回归", c: [-3.3, -1.7, -4.9] },

  // 无政府主义中心=(3.5,3.5,-1.5)
  { s: "无政府主义立场", t: "巴枯宁《国家制度与无政府状态》", c: [3.6, 3.6, -1.3] },
  { s: "无政府主义立场", t: "在私有制社会里没有腐败，只有分赃不均", c: [3.3, 3.2, -1.7] },
  { s: "无政府主义立场", t: "互助论：自然与社会的演化", c: [3.9, 3.8, -1.2] },

  // 社会民主主义中心=(-0.5,1.5,1.5)
  { s: "社会民主主义立场", t: "伯恩斯坦《社会主义的前提》", c: [-0.6, 1.6, 1.4] },
  { s: "社会民主主义立场", t: "福利国家与再分配的政治哲学", c: [-0.9, 1.3, 1.7] },
  { s: "社会民主主义立场", t: "渐进改良的宪政道路", c: [-0.4, 1.8, 1.3] },

  // 新保守主义中心=(3.5,-0.5,3.5)
  { s: "新保守主义立场", t: "干预主义与民主输出批判", c: [3.6, -0.4, 3.4] },
  { s: "新保守主义立场", t: "私有产权与加速主义技术观", c: [3.3, -0.7, 3.7] },

  // 未分类中心=(0,0,0)
  { s: "", t: "未分类：某统计年鉴摘录", c: [0.3, -0.4, 0] },
  { s: "", t: "未分类：坐标全零文档", c: [-0.5, 0.5, 0] },
];
const STC = { "马列毛主义立场": "#d3543f", "无政府主义立场": "#4f8cff",
  "社会民主主义立场": "#d9a441", "新保守主义立场": "#5bc8c8", "": "#8a8378" };
const SNAME = { "": "未分类" };

/* ---------- 状态 ---------- */
let yaw = 0.7, pitch = -0.42, zoom = 1, drag = null, hover = null;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), tip = $("tip");

function fit() {
  const w = Math.min(innerWidth - 24, 1100), h = innerHeight - 70;
  cv.width = w * devicePixelRatio; cv.height = h * devicePixelRatio;
  cv.style.width = w + "px"; cv.style.height = h + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener("resize", () => { fit(); draw(); });

/* ---------- 投影：等比 + 原点居中 + 连续缩放 ---------- */
function project(p) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x = p[0] * cy + p[2] * sy, z = -p[0] * sy + p[2] * cy, y = p[1];
  let y2 = y * cp - z * sp, z2 = y * sp + z * cp;
  const f = 80, s = f / (f + z2 / 5 * 6) * zoom;   // 弱透视：近大远小轻微，小立方更像正方
  const R = Math.min(cv.width / devicePixelRatio, cv.height / devicePixelRatio) * 0.062;
  return { x: cv.width / devicePixelRatio / 2 + x * R * s,
           y: cv.height / devicePixelRatio / 2 - y2 * R * s,
           d: z2, s };
}
/* 场色：三轴自选色加权混合（权重=(坐标+5)/10，默认红/绿/蓝） */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function axCols() { return [$("cx").value, $("cy").value, $("cz").value].map(hex2rgb); }
function fieldColor(c) {
  const cols = axCols();
  const rgb = [0, 1, 2].map(i => Math.min(255,
    cols.reduce((s, col, k) => s + col[i] * (c[k] + 5) / 10, 0)) | 0);
  return `rgb(${rgb})`;
}

/* ---------- 大立方几何 ---------- */
const V = []; for (let i = 0; i < 8; i++)
  V.push([i & 1 ? 5 : -5, i & 2 ? 5 : -5, i & 4 ? 5 : -5]);
/* 面：顶点序 + 固定轴(0x,1y,2z)与值 */
const FACES = [
  { v: [0, 1, 3, 2], ax: 0, val: -5 }, { v: [4, 5, 7, 6], ax: 0, val: 5 },
  { v: [0, 1, 5, 4], ax: 1, val: -5 }, { v: [2, 3, 7, 6], ax: 1, val: 5 },
  { v: [0, 2, 6, 4], ax: 2, val: -5 }, { v: [1, 3, 7, 5], ax: 2, val: 5 },
];

function drawCube(alpha) {
  const P = V.map(project);
  const order = FACES.map(f => ({ f, d: f.v.reduce((s, i) => s + P[i].d, 0) / 4 }))
    .sort((a, b) => b.d - a.d);           // 远→近
  for (const { f } of order) {
    const [a, b, c, d] = f.v.map(i => P[i]);
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
    const chans = [0, 1, 2].filter(x => x !== f.ax);
    const cols = axCols();
    /* 基色=固定轴色×该面位置权重；另两轴色沿各自边线性叠加 */
    const base = cols[f.ax].map(v => v * (f.val + 5) / 10 | 0);
    ctx.fillStyle = `rgb(${base})`; ctx.fill();
    const g1 = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g1.addColorStop(0, `rgba(${cols[chans[0]]},0)`);
    g1.addColorStop(1, `rgba(${cols[chans[0]]},1)`);
    ctx.fillStyle = g1; ctx.fill();
    const g2 = ctx.createLinearGradient(a.x, a.y, d.x, d.y);
    g2.addColorStop(0, `rgba(${cols[chans[1]]},0)`);
    g2.addColorStop(1, `rgba(${cols[chans[1]]},1)`);
    ctx.fillStyle = g2; ctx.fill();
    ctx.restore();
  }
  /* 等比方格：只画“面对视角”的三个内壁（远三面），外表面不画 */
  ctx.save(); ctx.lineWidth = 1.0;
  ctx.strokeStyle = "rgba(90,84,75,.55)";
  for (const o of order.slice(0, 3)) {
    const f = o.f;
    const axes = [0, 1, 2].filter(x => x !== f.ax);
    for (let k = 1; k < 5; k++) {
      const t = -5 + k * 2;
      for (const [u, w] of [[axes[0], axes[1]], [axes[1], axes[0]]]) {
        const p1 = [0, 0, 0], p2 = [0, 0, 0];
        p1[f.ax] = p2[f.ax] = f.val; p1[u] = t; p2[u] = t;
        p1[w] = -5; p2[w] = 5;
        const q1 = project(p1), q2 = project(p2);
        ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
      }
    }
  }
  ctx.restore();
  /* 线框 */
  ctx.save(); ctx.strokeStyle = "rgba(50,45,38,.8)"; ctx.lineWidth = 1.2;
  for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
    const diff = (i ^ j); if (diff === 1 || diff === 2 || diff === 4) {
      ctx.beginPath(); ctx.moveTo(P[i].x, P[i].y); ctx.lineTo(P[j].x, P[j].y); ctx.stroke();
    }
  }
  /* 三轴 0 点参考线 */
  ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(50,45,38,.45)";
  for (const ax of [0, 1, 2]) {
    const p1 = [0, 0, 0], p2 = [0, 0, 0];
    p1[ax] = -5; p2[ax] = 5;
    const q1 = project(p1), q2 = project(p2);
    ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke();
  }
  /* 轴尽头标名字：-端=neg / +端=pos（与 axes.ts 语义一致） */
  ctx.setLineDash([]);
  const AXN = [["公有", "私有"], ["集权", "无政府"], ["反帝", "干涉主义"]];
  ctx.font = "600 12px 'Microsoft YaHei',sans-serif"; ctx.textAlign = "center";
  for (const ax of [0, 1, 2]) {
    for (const [end, txt] of [[-1, AXN[ax][0]], [1, AXN[ax][1]]]) {
      const p = [0, 0, 0]; p[ax] = end * 5.9;
      const q = project(p);
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(239,236,230,.9)";
      ctx.strokeText(txt, q.x, q.y); ctx.fillStyle = "#26221d";
      ctx.fillText(txt, q.x, q.y);
    }
  }
  ctx.restore();
}

/* ---------- 立场小立方 + 文档点 + 公告牌文字 ---------- */
function stanceBoxes() {
  const m = {};
  for (const d of DOCS) (m[d.s] = m[d.s] || []).push(d);
  return Object.entries(m).map(([s, docs]) => {
    /* 未分类硬钉原点；其他立场=文档三轴均值 */
    const cen = s === "" ? [0, 0, 0]
      : [0, 1, 2].map(i => docs.reduce((a, d) => a + d.c[i], 0) / docs.length);
    /* 每立场 = 1×1×1 正方体（中心=三轴均值，半长固定 0.5） */
    const half = [0.5, 0.5, 0.5]; // 等边正方体，每轴半边长 0.5
    return { s, name: SNAME[s] || s, cen, half, n: docs.length, docs };
  });
}
function drawBox(b, colr, alpha) {
  const vs = [];
  for (let i = 0; i < 8; i++)
    vs.push(project([b.cen[0] + (i & 1 ? b.half[0] : -b.half[0]),
                     b.cen[1] + (i & 2 ? b.half[1] : -b.half[1]),
                     b.cen[2] + (i & 4 ? b.half[2] : -b.half[2])]));
  const F = [[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = colr;
  for (const f of F) { ctx.beginPath(); ctx.moveTo(vs[f[0]].x, vs[f[0]].y);
    for (const i of f.slice(1)) ctx.lineTo(vs[i].x, vs[i].y);
    ctx.closePath(); ctx.fill(); }
  ctx.globalAlpha = Math.min(1, alpha * 3 + .35); ctx.strokeStyle = colr; ctx.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
    const d = i ^ j; if (d === 1 || d === 2 || d === 4) {
      ctx.beginPath(); ctx.moveTo(vs[i].x, vs[i].y); ctx.lineTo(vs[j].x, vs[j].y); ctx.stroke();
    } }
  ctx.restore();
  return vs.reduce((s, v) => s + v.d, 0) / 8;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  const alpha = +$("al").value / 100;
  $("alv").textContent = $("al").value + "%";
  drawCube(alpha);
  const boxes = stanceBoxes();
  /* 深度队列：小立方面 → 点 → 文字，统一远→近 */
  const items = [];
  for (const b of boxes)
    items.push({ d: drawBoxDepth(b), kind: "box", b });
  for (const d of DOCS) {
    const p = project(d.c);
    items.push({ d: p.d, kind: "dot", p, doc: d });
  }
  items.sort((a, b) => b.d - a.d);
  const labelsOn = $("lab").checked;
  const texts = [];
  for (const it of items) {
    if (it.kind === "box") {
      const dep = drawBox(it.b, STC[it.b.s], Math.min(.5, alpha * .8 + .06));
      const c = project(it.b.cen);
      const hot = hover && hover.kind === "box" && hover.b === it.b;
      if (labelsOn || hot)
        texts.push({ c, dep, txt: `${it.b.name} · ${it.b.n}`,
                     col: STC[it.b.s], big: true, hot });
    } else {
      const col = fieldColor(it.doc.c);
      ctx.save();
      ctx.fillStyle = col; ctx.strokeStyle = "rgba(255,255,255,.85)";
      ctx.lineWidth = 1;
      const r = Math.max(2.5, 4.5 * it.p.s / zoom * zoom);
      ctx.beginPath(); ctx.arc(it.p.x, it.p.y, r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
      const hot = hover && hover.kind === "dot" && hover.doc === it.doc;
      if (hot) texts.push({ c: it.p, dep: it.d, txt: it.doc.t, col: "#26221d", big: false });
    }
  }
  /* 公告牌文字：远→近，近压远 */
  texts.sort((a, b) => b.dep - a.dep);
  for (const t of texts) {
    const fs = Math.max(10, Math.min(20, 13 * t.c.s));
    ctx.save(); ctx.font = `${t.big ? 600 : 400} ${fs}px "Microsoft YaHei",sans-serif`;
    ctx.textAlign = "center";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(239,236,230,.9)";
    const y = t.c.y - (t.big ? 14 * t.c.s : 10);
    ctx.strokeText(t.txt, t.c.x, y); ctx.fillStyle = t.col; ctx.fillText(t.txt, t.c.x, y);
    ctx.restore();
  }
  /* 命中表（悬停用） */
  draw.hits = [];
  for (const b of boxes) draw.hits.push({ kind: "box", b, p: project(b.cen), r: Math.max(...b.half) * 6 * zoom });
  for (const d of DOCS) draw.hits.push({ kind: "dot", doc: d, p: project(d.c), r: 6 });
}
function drawBoxDepth(b) { return project(b.cen).d; }

/* ---------- 交互 ---------- */
cv.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener("mouseup", () => drag = null);
addEventListener("mousemove", e => {
  if (drag) {
    const k = ($("inv").checked ? -1 : 1) * 0.008;
    yaw += (e.clientX - drag.x) * k; pitch += (e.clientY - drag.y) * k;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
    drag = { x: e.clientX, y: e.clientY }; draw(); return;
  }
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  hover = null;
  for (const h of (draw.hits || []).slice().reverse()) {
    if (Math.hypot(h.p.x - mx, h.p.y - my) < h.r) { hover = h; break; }
  }
  if (hover) {
    tip.style.display = "block"; tip.style.left = e.clientX + 14 + "px";
    tip.style.top = e.clientY + 10 + "px";
    tip.textContent = hover.kind === "box"
      ? `${hover.b.name} · ${hover.b.n} 篇（小立方=该立场文档坐标包络）`
      : hover.doc.t;
  } else tip.style.display = "none";
  draw();
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.4, Math.min(3.2, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  draw();
}, { passive: false });
for (const id of ["cx", "cy", "cz", "al", "inv", "lab"])
  $(id).addEventListener("input", draw);
$("rst").addEventListener("click", () => {
  yaw = 0.7; pitch = -0.42; zoom = 1;
  $("cx").value = "#ff0000"; $("cy").value = "#00ff00"; $("cz").value = "#0000ff";
  draw();
});

fit(); draw();
</script>
</body>
</html>
