[project]
name = "debate-engine-backend"
version = "0.1.0"
description = "Debate Engine - stance-aware local RAG rebuttal engine (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jieba>=0.42",
    "lancedb>=0.6",
    "numpy>=1.26",
    "chardet>=5.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.9"]
heavy = ["FlagEmbedding>=1.2", "docling>=2.0", "trafilatura>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
